<div class="container">

  <div class="login-box">
    <h1>Login</h1>

    <div class="error-message"><span *ngIf="errorMessage" >{{ errorMessage }}</span></div>
    <div class="loading"><span *ngIf="isLoading">Cargando...</span></div>
    <form (ngSubmit)="onSubmit($event)" #loginForm="ngForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" [(ngModel)]="auth.username" required
          (input)="onChangeField()" minlength="5"/>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" [(ngModel)]="auth.password" required
          (input)="onChangeField()" minlength="6" />
      </div>
      <button type="submit" class="btn" [disabled]="isLoading || loginForm.invalid">Login</button>
    </form>
  </div>
</div>
